apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: web-demo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/bunhorcode/deployments.git
    targetRevision: HEAD
    path: web-demo
  destination:
    server: https://kubernetes.default.svc
    namespace: web-demo
  syncPolicy:
    # automated:
    #   prune: true
    #   selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true