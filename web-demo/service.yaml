apiVersion: v1
kind: Service
metadata:
  name: web-demo
  namespace: web-demo
  labels:
    app.kubernetes.io/name: web-demo
    app.kubernetes.io/part-of: web-demo
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: web-demo
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 32004