apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: testing-web
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/bunhorcode/deployments.git
    targetRevision: HEAD
    path: testing-web
  destination:
    server: https://kubernetes.default.svc
    namespace: testing
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
