apiVersion: apps/v1
kind: Deployment
metadata:
  name: testing-web
  namespace: testing
  labels:
    app.kubernetes.io/name: testing-web
    app.kubernetes.io/part-of: testing
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: testing-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: testing-web
    spec:
      containers:
        - name: nginx
          image: nginx:1.25
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: web-content
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
              readOnly: true
      volumes:
        - name: web-content
          configMap:
            name: testing-web-content
