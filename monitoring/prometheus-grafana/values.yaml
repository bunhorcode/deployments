grafana:
  adminPassword: admin
  service:
    type: NodePort
    nodePort: 32000        # choose any free port between 30000–32767
  persistence:
    enabled: true
    size: 5Gi
  ingress:
    enabled: false         # disable ingress entirely

prometheus:
  service:
    type: NodePort
    nodePort: 32001        # another free port
  prometheusSpec:
    retention: 30d
    storageSpec:
      volumeClaimTemplate:
        spec:
          resources:
            requests:
              storage: 20Gi
  ingress:
    enabled: false         # disable ingress entirely
