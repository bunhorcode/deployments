grafana:
  adminPassword: admin
  service:
    type: NodePort
    nodePort: 30007
  persistence:
    enabled: true
    size: 5Gi
  ingress:
    enabled: false

prometheus:
  prometheusSpec:
    retention: 30d
    storageSpec:
      volumeClaimTemplate:
        spec:
          resources:
            requests:
              storage: 20Gi